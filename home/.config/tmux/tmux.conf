set -g default-terminal "tmux-256color"
# 24-bit colour, plus OSC 52 clipboard forwarding for remote yanks
set -as terminal-features ",*:RGB:clipboard"
set -g default-shell "/usr/bin/zsh"

set -g mouse on
set-window-option -g mode-keys vi

# Start indexing at 1
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Unbind default leader key binding and set it to C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Themeing inspired by Tokyo Night Zed Theme: https://github.com/ssaunderss/zed-tokyo-night/blob/main/themes/tokyo-night.json
# Status bar
set -g status-style bg='#16161e',fg='#a9b1d6' # Style for the status bar
set -g status-left ' ' # Clear the left side of the status bar
set -g status-right ' ' # Clear the right side of the status bar
set -g status-justify left # Window list starts at the left

# Window/panes
set -g window-style default # Background color of windows/panes, default = terminal bg
set -g window-active-style default # Background color of the active window/pane
set -g pane-border-style fg=#545c7e,bg=default # Border between panes, fg = the actual border
set -g pane-active-border-style fg=#7aa2f7,bg=default # Border on active pane, fg = the actual border

# Status bar window list
set -g window-status-style "fg=#545c7e,bg=default" # Inactive tab, dimmed
# Tabs show the basename of the active pane's working directory
set -g window-status-format " #I #{b:pane_current_path} " # No inline colours, so the styles above can win
set -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I #{b:pane_current_path} " # Active tab, filled pill
set -g window-status-separator "" # Pills carry their own padding
set -g window-status-activity-style "fg=#a9b1d6,bg=#1e2438" # Activity, a soft blue-tinted fill
set -g window-status-bell-style "fg=#a9b1d6,bg=#1e2438" # Same cue for a bell, no extra inverting

# Command prompt (leader + :) and copy-mode selection
set -g message-style "fg=#c0caf5,bg=#1e2438"
set -g message-command-style "fg=#c0caf5,bg=#1e2438"
set -g mode-style "fg=#c0caf5,bg=#283457"

# Other options
set -g monitor-activity on # Indicate activity in status bar list

# Keybindings
bind-key R source-file ~/.config/tmux/tmux.conf \; \
  display-popup -w 30 -h 3 -b rounded -S "fg=#7aa2f7" -s "bg=#1e2438,fg=#c0caf5" \
  -E "printf '\033[?25l  \033[1;38;2;122;162;247m✓ tmux.conf reloaded\033[0m'; sleep 1; printf '\033[?25h'"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Toggle zoom with Alt+f
bind -n M-f resize-pane -Z

# Switch windows with Alt+number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1
bind -n M-0 select-window -t 10

# Open new windows and panes in CWD
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Plugins, apply changes with `prefix + I`
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Saving sessions and automatically restore on start
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
